name: CICD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: What should Terraform do?
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  id-token: write # lets the job request an OIDC token to log in to AWS
  contents: read

# Never run two deployments at the same time.
concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
  TF_VAR_notification_email: ${{ secrets.NOTIFICATION_EMAIL }}

jobs:
  cicd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- Python checks (skipped for manual runs) ----
      - uses: actions/setup-python@v5
        if: github.event_name != 'workflow_dispatch'
        with:
          python-version: "3.12"
      - name: Install dependencies
        if: github.event_name != 'workflow_dispatch'
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        if: github.event_name != 'workflow_dispatch'
        run: ruff check .
      - name: Tests (pytest)
        if: github.event_name != 'workflow_dispatch'
        run: pytest

      # ---- Terraform ----
      - uses: hashicorp/setup-terraform@v3

      - name: Debug OIDC subject (temporary)
        run: |
          python3 - <<'EOF'
          import os, json, base64, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req = urllib.request.Request(
              url, headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]}
          )
          token = json.load(urllib.request.urlopen(req))["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print("sub:", claims["sub"])
          print("aud:", claims["aud"])
          EOF

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Format check
        if: inputs.action != 'destroy'
        run: terraform fmt -check -recursive

      - name: Init
        working-directory: terraform
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Validate
        if: inputs.action != 'destroy'
        working-directory: terraform
        run: terraform validate

      - name: Plan
        if: github.event_name != 'workflow_dispatch' || inputs.action != 'destroy'
        working-directory: terraform
        run: terraform plan -input=false

      - name: Apply
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        working-directory: terraform
        run: terraform apply -auto-approve -input=false

      - name: Destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        working-directory: terraform
        run: terraform destroy -auto-approve -input=false
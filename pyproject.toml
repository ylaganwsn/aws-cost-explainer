[project]
name = "cost-explainer"
version = "0.1.0"
description = "Weekly AWS cost change report with optional LLM explanation"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
aws = ["boto3"]
dev = ["pytest", "ruff", "boto3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
